<div class="gallery-card break-inside-avoid group relative rounded-xl overflow-hidden bg-gray-200 cursor-pointer mb-6" 
     style="transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);"
     onmouseenter="this.style.transform='translateY(-8px) scale(1.01)'; this.style.boxShadow='0 24px 48px rgba(0,0,0,.18)';"
     onmouseleave="this.style.transform='none'; this.style.boxShadow='none';"
     onclick="openLightbox('{{ photo_url }}', '{{ p.title|escapejs }}', '{{ p.photographer.full_name|default:'Citizen'|escapejs }}', '{{ p.location|default:'Naroda'|escapejs }}', '{{ p.approved_at|date:'M d, Y' }}')">
     
  <img src="{{ photo_url }}" alt="{{ p.title|default:'Gallery Image' }}" loading="lazy" class="w-full h-auto object-cover transform transition-transform duration-700 group-hover:scale-108" style="transform-origin: center;">
  
  <!-- Hover Overlay -->
  <div class="absolute inset-0 bg-gradient-to-t from-[#04110A]/90 via-[#04110A]/30 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-5">
    <span class="text-[10px] font-bold text-[#22C55E] uppercase tracking-wider mb-1">{{ p.category.name|default:"Uncategorized" }}</span>
    <h4 class="text-white font-serif font-bold text-lg leading-tight mb-1">{{ p.title|default:"Untitled" }}</h4>
    <p class="text-gray-300 text-xs flex items-center gap-1 font-medium">
      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
      {{ p.location|default:"Naroda" }}
    </p>
  </div>
</div>
